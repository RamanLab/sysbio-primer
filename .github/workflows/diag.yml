# TEMPORARY: find a MATLAB release whose linprog works in CI. Will be removed.
name: diag
on: workflow_dispatch
jobs:
  linprog:
    strategy:
      fail-fast: false
      matrix:
        release: [R2025b, R2025a, R2024b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          products: Optimization_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('diag'); diag_linprog
