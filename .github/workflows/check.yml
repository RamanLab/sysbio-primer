# Run every example in Python and in MATLAB, then check that the two agree
# with each other and with the values given in the book.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -e .
      - name: Run the Python examples
        run: python tools/run_examples.py
      - name: Check Python results against the book
        run: python tests/compare.py
      - name: Bundle outputs
        run: find examples -type d -path '*/out/python' | tar czf out-python.tgz -T -
      - uses: actions/upload-artifact@v7
        with:
          name: out-python
          path: out-python.tgz

  matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Optimization_Toolbox
          cache: true
      - name: Get the COBRA Toolbox
        run: git clone --depth 1 https://github.com/opencobra/cobratoolbox.git "$HOME/cobratoolbox"
      - name: Run the MATLAB examples
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); ci_matlab
      - name: Bundle outputs
        if: always()
        run: find examples -type d -path '*/out/matlab' | tar czf out-matlab.tgz -T -
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: out-matlab
          path: out-matlab.tgz

  compare:
    needs: [python, matlab]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: out-python
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: out-matlab
          path: artifacts
      - name: Unpack fresh outputs
        run: |
          tar xzf artifacts/out-python.tgz
          tar xzf artifacts/out-matlab.tgz
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: MATLAB vs Python vs book
        run: python tests/compare.py --require-matlab
